name: Security rules

on:
  push:
    branches: [main]
    paths: [firestore.rules, tests/**, .github/workflows/rules.yml]
  pull_request:
    paths: [firestore.rules, tests/**, .github/workflows/rules.yml]

permissions:
  contents: read

jobs:
  rules:
    name: Firestore rules tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:rules
